name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Allow re-running CI by hand (GitHub occasionally drops a push event).
  workflow_dispatch:

# CI only ever reads the tree. Releasing needs a repository-wide default of
# read-and-write so the release job can create a release and push its image;
# stating the floor here keeps that default from silently widening this
# workflow's token too.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # The ratchet: warnings are errors, so a new one cannot land quietly. Any
      # lint we deliberately keep carries an `#[allow]` and a reason at the site.
      - name: Lint host workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Lint dezh-core
        working-directory: dezh-core
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run host workspace tests
        run: cargo test --locked --workspace

      - name: Run dezh-core tests (shared engine; its own workspace)
        working-directory: dezh-core
        run: cargo test --locked

      - name: Run effect-gateway acceptance (W12; no Dezh involved)
        run: python3 tools/ci/gateway_test.py

      - name: Run public review hygiene scan
        run: python3 tools/review/scan_public.py

      - name: Check documentation links and sprawl
        run: python3 tools/ci/check_docs.py

      - name: Check docs/assets diagrams match their generator
        run: python3 tools/docs/build_diagrams.py --check

      - name: Compile Python review tooling
        run: >
          python3 -m py_compile
          tools/docs/build_diagrams.py
          tools/docs/diagram_tokens.py
          tools/review/run_full_review.py
          tools/review/build_release_artifacts.py
          tools/review/scan_public.py
          tools/review/make_review_package.py
          tools/demo/run_review_demo.py
          tools/demo/run_agent_demo.py
          tools/ci/qemu_smoke.py
          tools/ci/gateway_test.py
          tools/ci/effect_test.py
          tools/gateway/dezh_gateway.py
          tools/ci/check_docs.py
          tools/ci/sdk_test.py
          tools/sdk/build_pkg.py
          tools/sdk/install_pkg.py
          tools/sdk/dzas.py

  # Superseded Step 1..9 prototypes (see spikes/README.md). Nothing shipping
  # depends on them, and they pull wasmtime and ~190 crates, so they get their
  # own job rather than sitting in the critical path - but they do stay built,
  # because history that no longer compiles is not evidence of anything.
  spikes:
    name: Superseded host spikes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Version and targets come from rust-toolchain.toml, so CI and a
      # contributor's machine cannot silently disagree about which lints exist.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint spikes
        working-directory: spikes
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test spikes
        working-directory: spikes
        run: cargo test --locked

  bare-metal:
    name: Bare-metal builds and QEMU smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Version and targets come from rust-toolchain.toml, so CI and a
      # contributor's machine cannot silently disagree about which lints exist.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-misc qemu-system-x86

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint RISC-V kernel
        working-directory: dezh-boot
        run: cargo clippy --locked -- -D warnings

      # A re-entrant take of the scheduler lock hangs the hart rather than
      # failing, so QEMU would report a bare timeout. Catch it before the boot.
      - name: Check the scheduler lock is never taken re-entrantly
        run: python3 tools/ci/check_sched_lock.py

      - name: Build RISC-V kernel
        working-directory: dezh-boot
        run: cargo build --locked

      - name: Boot RISC-V kernel in QEMU
        run: >
          python3 tools/ci/qemu_smoke.py riscv64
          --kernel dezh-boot/target/riscv64gc-unknown-none-elf/debug/dezh-boot
          --qemu qemu-system-riscv64

      - name: Run SDK package install acceptance
        run: >
          python3 tools/ci/sdk_test.py
          --kernel dezh-boot/target/riscv64gc-unknown-none-elf/debug/dezh-boot
          --qemu qemu-system-riscv64

      - name: Run W12 external-effect acceptance (real gateway + real git repo)
        run: >
          python3 tools/ci/effect_test.py
          --kernel dezh-boot/target/riscv64gc-unknown-none-elf/debug/dezh-boot
          --qemu qemu-system-riscv64

      - name: Run F1 agent-containment demo
        run: >
          python3 tools/demo/run_agent_demo.py
          --kernel dezh-boot/target/riscv64gc-unknown-none-elf/debug/dezh-boot
          --qemu qemu-system-riscv64
          --transcript /tmp/demo-transcript-agent-f1.md

      - name: Lint x86_64 kernel
        working-directory: dezh-boot-x86
        run: cargo clippy --locked -- -D warnings

      - name: Build x86_64 kernel
        working-directory: dezh-boot-x86
        run: cargo build --locked

      - name: Boot x86_64 kernel in QEMU
        run: >
          python3 tools/ci/qemu_smoke.py x86_64
          --kernel dezh-boot-x86/target/x86_64-unknown-none/debug/dezh-boot-x86
          --qemu qemu-system-x86_64

      - name: Build review release artifacts
        run: python3 tools/review/build_release_artifacts.py --tag ci
