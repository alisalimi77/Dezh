# TEMPORARY. Delete once the GHCR publish is restored.
#
# The release job's `docker push` to GHCR has been refused with
# `denied: permission_denied: write_package` since v0.3-review, while the
# package itself is alive and anonymously pullable (v0.1-review, v0.2-review,
# latest). So the question is narrow: does THIS repository's `GITHUB_TOKEN` get
# push authority on that package, or not?
#
# It has to be `GITHUB_TOKEN`, because that is the credential that was refused.
# A personal access token would succeed and prove nothing.
#
# It deliberately pushes no image. Asking the registry for a push-scoped token
# and opening a blob upload session answers the same question and leaves no tag
# behind on a public package.
name: GHCR probe

# `workflow_dispatch` only works from the default branch, and `main` is the
# public review branch - a throwaway probe does not belong on it. So it fires on
# its own file instead: pushing this workflow to `develop` runs it, and deleting
# it stops it.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['.github/workflows/ghcr-probe.yml']

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask GHCR for push authority on the package
        env:
          IMAGE: ${{ github.repository_owner }}/dezh-review-env
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "package: $IMAGE"

          # 1. The registry token exchange. Its `access` claim is the answer: if
          #    push is not granted here, `docker push` cannot succeed. The raw
          #    response is printed first, because the failures worth seeing are
          #    the ones that do not come back as the JSON we expected.
          resp=$(curl -sS -u "$ACTOR:$TOKEN" "https://ghcr.io/token?scope=repository:${IMAGE}:pull,push&service=ghcr.io" 2>&1)
          echo "--- token response (first 600 bytes) ---"
          echo "$resp" | head -c 600
          echo
          echo "----------------------------------------"

          jwt=$(echo "$resp" | jq -r '.token // empty' 2>/dev/null)
          if [ -z "$jwt" ]; then
            echo "RESULT: no token issued - see the response above"
            exit 1
          fi

          # The granted scope lives in the JWT payload, which is base64url.
          payload=$(echo "$jwt" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          actions=$(echo "$payload" | base64 -d 2>/dev/null | jq -r '[.access[]?.actions[]?] | join(",")')
          echo "granted actions: ${actions:-(none)}"

          # 2. Exercise it. A blob upload session is the first thing `docker
          #    push` does and the step that returned the denial. 202 means we
          #    may write; 403 is the failure we are chasing. Nothing is
          #    committed, so no tag or version appears on the package.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" "https://ghcr.io/v2/${IMAGE}/blobs/uploads/")
          echo "blob upload session: HTTP $code"
          head -c 400 /tmp/body 2>/dev/null
          echo

          case "$actions" in
            *push*)
              if [ "$code" = "202" ]; then
                echo "RESULT: PUSH AUTHORISED - restore the publish steps in release.yml"
                exit 0
              fi
              echo "RESULT: token granted push, registry refused the upload ($code)"
              exit 1
              ;;
            *)
              echo "RESULT: STILL DENIED - the package's Actions access does not include this repository"
              exit 1
              ;;
          esac
