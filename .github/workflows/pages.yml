# Publishes `docs/` as a searchable site.
#
# The documents already read as a book and assume an order; until this existed
# the only way through them was raw files on GitHub, one at a time, with no
# search and no sense of where you were in the argument. `book.toml` points
# mdBook at `docs/` in place rather than copying, so there is one copy of every
# document and a link that works on GitHub works on the site.
#
# It runs on `main` only. `develop` moves several times a day and the site is
# what reviewers are pointed at.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run is superseded by a newer one, but an in-flight deploy is allowed
# to finish rather than being cancelled half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mdBook
        env:
          MDBOOK_VERSION: '0.4.40'
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check the docs before publishing them
        run: python3 tools/ci/check_docs.py

      - name: Build the book
        run: mdbook build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
