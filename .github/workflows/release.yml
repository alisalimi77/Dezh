name: Release

on:
  push:
    tags:
      - "v*"

# `packages: write` was dropped along with the GHCR publish below. Nothing this
# job does now touches a registry, and the repository's stance is least
# privilege for CI.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build review release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,riscv64gc-unknown-none-elf,x86_64-unknown-none,riscv64gc-unknown-linux-musl

      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-misc qemu-system-x86 \
            grub-pc-bin grub2-common xorriso mtools

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run public hygiene scan
        run: python3 tools/review/scan_public.py

      - name: Run host workspace tests
        run: cargo test --locked --workspace

      - name: Build RISC-V kernel
        working-directory: dezh-boot
        run: cargo build --locked

      - name: Build x86_64 kernel
        working-directory: dezh-boot-x86
        run: cargo build --locked

      - name: Run RISC-V QEMU smoke
        run: >
          python3 tools/ci/qemu_smoke.py riscv64
          --kernel dezh-boot/target/riscv64gc-unknown-none-elf/debug/dezh-boot
          --qemu qemu-system-riscv64

      - name: Run x86_64 QEMU smoke
        run: >
          python3 tools/ci/qemu_smoke.py x86_64
          --kernel dezh-boot-x86/target/x86_64-unknown-none/debug/dezh-boot-x86
          --qemu qemu-system-x86_64

      - name: Generate review transcript
        run: >
          python3 tools/demo/run_review_demo.py
          --kernel dezh-boot/target/riscv64gc-unknown-none-elf/debug/dezh-boot
          --qemu-riscv qemu-system-riscv64
          --mode short
          --no-build
          --transcript dist/release/demo-transcript-riscv64.md

      - name: Build release artifacts
        run: python3 tools/review/build_release_artifacts.py --tag "${{ github.ref_name }}"

      - name: Boot the release x86 ISO in QEMU (validate the artifact)
        run: >
          python3 tools/ci/qemu_smoke.py x86_64
          --iso dist/release/dezh-${{ github.ref_name }}-x86_64.iso
          --kernel dezh-boot-x86/target/x86_64-unknown-none/debug/dezh-boot-x86
          --qemu qemu-system-x86_64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dezh-${{ github.ref_name }}-review-artifacts
          path: dist/release/*

      # Idempotent on purpose. A release job that only works on a pristine tag
      # cannot be re-run, so any later step failing (a registry permission, a
      # flaky push) strands the run red with no way back to green short of
      # deleting a published release.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - refreshing notes and assets"
            gh release edit "$TAG" \
              --title "Dezh OS $TAG" \
              --notes-file docs/RELEASE_NOTES.md
            gh release upload "$TAG" dist/release/* --clobber
          else
            gh release create "$TAG" dist/release/* \
              --title "Dezh OS $TAG" \
              --notes-file docs/RELEASE_NOTES.md
          fi

      # The GHCR publish that used to live here is gone. It ran on v0.3 and
      # v0.4 and was refused both times with `denied: permission_denied:
      # write_package`, so no tag of the review image was ever published while
      # the release run went red for it. Nothing depends on the image, and the
      # reasoning is the one already written down in rust-toolchain.toml: a gate
      # that breaks for reasons unrelated to the change under review is a gate
      # people learn to ignore. A red release on a public repo teaches exactly
      # that, and it teaches it to the reviewers we are inviting.
      #
      # The cause is not in this file - it requests `packages: write` and the
      # repository's default workflow-token permission is already `write`. It is
      # the package's own Actions access, changed in GitHub's web UI. When that
      # is sorted, restore these three steps rather than reinventing them:
      #
      # Restoring it also means putting `packages: write` back in the
      # permissions block above, and REGISTRY_IMAGE back in env as
      # `ghcr.io/${{ github.repository_owner }}/dezh-review-env`:
      #
      #   - name: Log in to GitHub Container Registry
      #     run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      #   - name: Build review environment image
      #     run: docker build -f Dockerfile.review -t "$REGISTRY_IMAGE:${{ github.ref_name }}" -t "$REGISTRY_IMAGE:latest" .
      #   - name: Publish review environment image
      #     run: docker push "$REGISTRY_IMAGE:${{ github.ref_name }}" && docker push "$REGISTRY_IMAGE:latest"
      #
      # `Dockerfile.review` stays in the tree and still builds the environment
      # locally, which is what the docs now point at.
