# Marz - the guarded egress boundary daemon. A separate RISC-V ELF loaded into
# its own U-mode address space by dezh-boot, holding ONLY the granted virtio-net
# MMIO page plus a DMA window. It never scans for devices and never touches the
# block device. See docs/SUBSYSTEMS.md (Marz).
[package]
name = "marz"
version = "0.0.0"
edition = "2024"
publish = false

# For the internet checksum only. The arithmetic lives in `dezh-core` so it can
# be host-tested with real inputs; the volatile reads out of the DMA window stay
# here, where they belong. Unused items (the signature verifier and the rest) are
# dead-stripped by LTO in the release profile this daemon is built with.
[dependencies]
dezh-core = { path = "../../dezh-core" }

[[bin]]
name = "marz"
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[workspace]
