# User-space virtio-blk driver/transaction program. It is a separate RISC-V ELF
# loaded into its own U-mode address space by dezh-boot.
[package]
name = "virtio-blk"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "virtio-blk"
path = "src/main.rs"

# The Cairn commit-record format only. Both sides of that format used to be
# open-coded here against a fixed data pointer, so nothing could check them
# against anything but each other. Unused items are dead-stripped by LTO below.
[dependencies]
dezh-core = { path = "../../dezh-core" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[workspace]
