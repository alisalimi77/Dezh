<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d">
<title id="t">Dezh OS -- intent-native, effect-accountable operating-system prototype</title>
<desc id="d">Banner. Left: the Dezh OS wordmark, the project's rule that no program starts with ambient authority, and three measured results from the QEMU smoke run. Right: the effect path in four stages -- an agent runs under one intent, the kernel grants only the intersection of what was requested with the intent ceiling, every effect is recorded on the Sand ledger with its actor, intent, derived capability and reversibility, and Sfar rolls a whole mission back by retracting the reversible effects and refusing the irreversible ones with a reason.</desc>
<style>:root{--canvas:#ffffff;--surface:#f6f8fa;--surface-2:#eaeef2;--border:#d1d9e0;--border-strong:#b7bfc7;--fg:#1f2328;--fg-muted:#59636e;--fg-subtle:#818b98;--accent:#0969da;--accent-wash:#ddf4ff;--success:#1a7f37;--attention:#9a6700;--danger:#cf222e;--term-canvas:#f6f8fa;--term-chrome:#eaeef2;--term-fg:#1f2328;--term-dim:#59636e;--term-info:#0550ae;--term-note:#0969da;--term-ok:#1a7f37;--term-warn:#9a6700;--term-bad:#cf222e;}@media(prefers-color-scheme:dark){:root{--canvas:#0d1117;--surface:#161b22;--surface-2:#21262d;--border:#30363d;--border-strong:#3d444d;--fg:#e6edf3;--fg-muted:#8b949e;--fg-subtle:#6e7681;--accent:#58a6ff;--accent-wash:#0c2d6b;--success:#3fb950;--attention:#d29922;--danger:#f85149;--term-canvas:#0d1117;--term-chrome:#161b22;--term-fg:#e6edf3;--term-dim:#6e7681;--term-info:#58a6ff;--term-note:#79c0ff;--term-ok:#3fb950;--term-warn:#e3b341;--term-bad:#ff7b72;}}.hero{fill:var(--fg);font:700 64px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.eyebrow{fill:var(--accent);font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;letter-spacing:.16em}.lead{fill:var(--fg);font:600 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.body{fill:var(--fg-muted);font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.boxt{fill:var(--fg);font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.boxn{fill:var(--fg-muted);font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.card{fill:var(--surface);stroke:var(--border);stroke-width:1.5}.wire{stroke:var(--border-strong);stroke-width:1.5;fill:none}.stat{fill:var(--fg-muted);font:400 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.statv{fill:var(--fg);font:700 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.tag{fill:var(--fg-subtle);font:600 10px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;letter-spacing:.1em}.pulse{fill:var(--accent);animation:fall 6s cubic-bezier(.4,0,.5,1) infinite}@keyframes fall{0%{transform:translateY(0);opacity:0}4%{opacity:1}22%{transform:translateY(38px);opacity:1}26%{transform:translateY(38px);opacity:0}100%{transform:translateY(38px);opacity:0}}.p2{animation-delay:.5s}.p3{animation-delay:1s}.halo{fill:var(--accent);opacity:0;animation:land 6s cubic-bezier(.4,0,.5,1) infinite}@keyframes land{0%,20%{opacity:0;r:3}24%{opacity:.55;r:9}34%{opacity:0;r:12}100%{opacity:0;r:3}}.h2{animation-delay:.5s}.h3{animation-delay:1s}@media(prefers-reduced-motion:reduce){.pulse,.halo{animation:none;opacity:0}}</style>
<rect width="1280" height="470" fill="var(--canvas)"/>
<path d="M 80 64 H 1200" stroke="var(--border)" stroke-width="1"/>
<text x="80" y="112" class="eyebrow">INTENT-NATIVE · EFFECT-ACCOUNTABLE · RISC-V + x86_64</text>
<text x="80" y="196" class="hero">Dezh OS</text>
<rect x="80" y="218" width="72" height="4" rx="2" fill="var(--accent)"/>
<text x="80" y="272" class="lead">No program starts with ambient authority.</text>
<text x="80" y="312" class="body">Every effect is backed by an explicit capability — and every effect</text>
<text x="80" y="336" class="body">stays attributable, and reversible where it honestly can be.</text>
<path d="M 80 364 H 620" stroke="var(--border)" stroke-width="1"/>
<text x="80" y="390" class="statv">5 / 5</text>
<text x="248" y="390" class="stat">adversary escapes stopped at named boundaries</text>
<text x="80" y="414" class="statv">4 × 3</text>
<text x="248" y="414" class="stat">U-mode tasks across harts, 0 faults, 3 live at once</text>
<text x="80" y="438" class="statv">2 undone, 1 refused</text>
<text x="248" y="438" class="stat">whole-mission rollback, explained not erased</text>
<rect x="700" y="76" width="500" height="62" rx="6" class="card"/>
<text x="1184" y="96" class="tag" text-anchor="end">01</text>
<text x="716" y="103" class="boxt">Agent</text>
<text x="716" y="122" class="boxn">runs under one intent — Ahd#4</text>
<path d="M 950.0 138 V 176" class="wire"/>
<circle cx="950.0" cy="176" r="3" fill="var(--accent)"/>
<circle cx="950.0" cy="138" r="3.5" class="pulse"/>
<circle cx="950.0" cy="176" r="3" class="halo"/>
<rect x="700" y="176" width="500" height="62" rx="6" fill="var(--accent-wash)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="1184" y="196" class="tag" text-anchor="end">02</text>
<text x="716" y="203" class="boxt">Kernel</text>
<text x="716" y="222" class="boxn">no ambient authority · granted = requested ∩ ceiling</text>
<path d="M 950.0 238 V 276" class="wire"/>
<circle cx="950.0" cy="276" r="3" fill="var(--accent)"/>
<circle cx="950.0" cy="238" r="3.5" class="pulse p2"/>
<circle cx="950.0" cy="276" r="3" class="halo h2"/>
<rect x="700" y="276" width="500" height="62" rx="6" class="card"/>
<text x="1184" y="296" class="tag" text-anchor="end">03</text>
<text x="716" y="303" class="boxt">Sand ledger</text>
<text x="716" y="322" class="boxn">every effect: actor → intent → derived cap → reversibility</text>
<path d="M 950.0 338 V 376" class="wire"/>
<circle cx="950.0" cy="376" r="3" fill="var(--accent)"/>
<circle cx="950.0" cy="338" r="3.5" class="pulse p3"/>
<circle cx="950.0" cy="376" r="3" class="halo h3"/>
<rect x="700" y="376" width="500" height="62" rx="6" class="card"/>
<text x="1184" y="396" class="tag" text-anchor="end">04</text>
<text x="716" y="403" class="boxt">Sfar rollback</text>
<text x="716" y="422" class="boxn">retracts the reversible · refuses the irreversible, with a reason</text>
</svg>
