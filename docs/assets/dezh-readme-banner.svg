<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">Dezh OS -- intent-native, capability-secure operating-system prototype</title>
<desc id="d">Banner. Left: the Dezh OS wordmark with the project's rule -- no program starts with ambient authority. Right: a layer diagram. Apps, the virtio-block driver and agents run in user mode; every call crosses a kernel that grants no ambient authority; effects land in the Cairn commit log, which is rollbackable.</desc>
<style>:root{--canvas:#ffffff;--surface:#f6f8fa;--surface-2:#eaeef2;--border:#d1d9e0;--border-strong:#b7bfc7;--fg:#1f2328;--fg-muted:#59636e;--fg-subtle:#818b98;--accent:#0969da;--accent-wash:#ddf4ff;--success:#1a7f37;--attention:#9a6700;--danger:#cf222e;--term-canvas:#f6f8fa;--term-chrome:#eaeef2;--term-fg:#1f2328;--term-dim:#59636e;--term-info:#0550ae;--term-note:#0969da;--term-ok:#1a7f37;--term-warn:#9a6700;--term-bad:#cf222e;}@media(prefers-color-scheme:dark){:root{--canvas:#0d1117;--surface:#161b22;--surface-2:#21262d;--border:#30363d;--border-strong:#3d444d;--fg:#e6edf3;--fg-muted:#8b949e;--fg-subtle:#6e7681;--accent:#58a6ff;--accent-wash:#0c2d6b;--success:#3fb950;--attention:#d29922;--danger:#f85149;--term-canvas:#0d1117;--term-chrome:#161b22;--term-fg:#e6edf3;--term-dim:#6e7681;--term-info:#58a6ff;--term-note:#79c0ff;--term-ok:#3fb950;--term-warn:#e3b341;--term-bad:#ff7b72;}}.hero{fill:var(--fg);font:700 64px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.eyebrow{fill:var(--accent);font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;letter-spacing:.16em}.lead{fill:var(--fg);font:600 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.body{fill:var(--fg-muted);font:400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.boxt{fill:var(--fg);font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.boxn{fill:var(--fg-muted);font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif}.card{fill:var(--surface);stroke:var(--border);stroke-width:1.5}.wire{stroke:var(--border-strong);stroke-width:1.5;fill:none}</style>
<rect width="1280" height="400" fill="var(--canvas)"/>
<path d="M 80 64 H 1200" stroke="var(--border)" stroke-width="1"/>
<text x="80" y="112" class="eyebrow">CAPABILITY-SECURE OS PROTOTYPE · RISC-V · x86_64</text>
<text x="80" y="192" class="hero">Dezh OS</text>
<rect x="80" y="214" width="72" height="4" rx="2" fill="var(--accent)"/>
<text x="80" y="264" class="lead">No program starts with ambient authority.</text>
<text x="80" y="300" class="body">Every effect is backed by an explicit capability, grant or lease —</text>
<text x="80" y="324" class="body">and every effect stays attributable, and reversible where it can be.</text>
<rect x="700.0" y="92" width="156.0" height="60" rx="6" class="card"/>
<text x="714.0" y="118" class="boxt">Apps</text>
<text x="714.0" y="137" class="boxn">manifest caps</text>
<path d="M 778.0 152 V 196" class="wire"/>
<circle cx="778.0" cy="196" r="3" fill="var(--accent)"/>
<rect x="872.0" y="92" width="156.0" height="60" rx="6" class="card"/>
<text x="886.0" y="118" class="boxt">Driver</text>
<text x="886.0" y="137" class="boxn">virtio-block</text>
<path d="M 950.0 152 V 196" class="wire"/>
<circle cx="950.0" cy="196" r="3" fill="var(--accent)"/>
<rect x="1044.0" y="92" width="156.0" height="60" rx="6" class="card"/>
<text x="1058.0" y="118" class="boxt">Agents</text>
<text x="1058.0" y="137" class="boxn">one intent</text>
<path d="M 1122.0 152 V 196" class="wire"/>
<circle cx="1122.0" cy="196" r="3" fill="var(--accent)"/>
<rect x="700" y="196" width="500" height="60" rx="6" fill="var(--accent-wash)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="716" y="222" class="boxt">Kernel</text>
<text x="716" y="241" class="boxn">typed IPC · capability check on every effect · no ambient authority</text>
<path d="M 950.0 256 V 284" class="wire"/>
<circle cx="950.0" cy="284" r="3" fill="var(--accent)"/>
<rect x="700" y="284" width="500" height="60" rx="6" class="card"/>
<text x="716" y="310" class="boxt">Cairn</text>
<text x="716" y="329" class="boxn">commit log · per-app namespaces · rollback and compensation</text>
</svg>
